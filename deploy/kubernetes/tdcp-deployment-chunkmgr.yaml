---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chunk-manager
  namespace: default
  labels:
    app.kubernetes.io/name: chunk-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: # Pod selector
    matchLabels:
      app.kubernetes.io/name: chunk-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chunk-manager
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64 # Only built for x86_64
      terminationGracePeriodSeconds: 30
      containers:
        - name: chunk-manager
          image: 906171432343.dkr.ecr.us-east-1.amazonaws.com/chunk-manager:cb0f926d7f0f
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chunk-manager-app
                  key: uri
            - name: GRPC_LISTEN_ADDR
              value: ":9090"
            - name: POSTGRES_MAX_CONNECTIONS
              value: "10"
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
          startupProbe:
            grpc:
              port: 9090
              service: liveness
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 9090
              service: liveness
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9090
              service: readiness
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi