---
apiVersion: v1
kind: Service
metadata:
  name: chunk-manager-public
  namespace: default
  labels:
    app.kubernetes.io/name: chunk-manager
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: chunk-manager
  ports:
    - name: grpc
      protocol: TCP
      port: 9090
      targetPort: grpc
      # h2c is HTTP/2 over cleartext TCP (no TLS)
      appProtocol: kubernetes.io/h2c
